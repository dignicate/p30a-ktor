# yamllint disable-line
name: Manual Build and Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_HOME: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy mongo.properties
        run: |
          cp env/${{ inputs.env }}/mongo.properties src/main/resources/mongo.properties

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew installDist

      - name: Generate build number (JST) and rename folder
        id: build_no
        run: |
          export TZ=Asia/Tokyo
          DATE=$(date +%Y%m%d%H%M%S-)
          COMMIT=$(git log -1 --format="%H")
          BUILD_NO=${DATE}${COMMIT}
          echo "Build number: $BUILD_NO"
          echo "$BUILD_NO" > .build_no
          mv build/install/ktor-app build/install/$BUILD_NO
          echo "value=$BUILD_NO" >> $GITHUB_OUTPUT

      - name: Prepare deploy target (flat structure)
        run: |
          mkdir -p deploy-target
          cp -r build/install/${{ steps.build_no.outputs.value }}/* deploy-target/
          cp Dockerfile .dockerignore deploy-target/

      - name: Upload to server (flat)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-target/*"
          target: "~/release/${{ steps.build_no.outputs.value }}"

      - name: Deploy on remote server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/release/${{ steps.build_no.outputs.value }}
            docker build -t my-ktor-app:${{ steps.build_no.outputs.value }} .
            docker stop my-ktor-app || true
            docker rm my-ktor-app || true
            docker run -d -p 8080:8080 --name my-ktor-app my-ktor-app:${{ steps.build_no.outputs.value }}
