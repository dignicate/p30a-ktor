# yamllint disable-line
name: Manual Build and Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prd
          - prd-manual

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_HOME: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy mongo.properties
        run: |
          cp env/${{ inputs.env }}/mongo.properties src/main/resources/mongo.properties

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew installDist

      - name: Generate build number (JST) and rename folder
        id: build_no
        run: |
          export TZ=Asia/Tokyo
          DATE=$(date +%Y%m%d%H%M%S-)
          COMMIT=$(git log -1 --format="%H")
          BUILD_NO=${DATE}${COMMIT}
          echo "Build number: $BUILD_NO"
          echo "$BUILD_NO" > .build_no
          mv build/install/ktor-app build/install/$BUILD_NO
          echo "value=$BUILD_NO" >> $GITHUB_OUTPUT

      - name: Prepare deploy-flat and tar it
        run: |
          mkdir -p deploy-flat
          cp -r build/install/${{ steps.build_no.outputs.value }}/bin deploy-flat/
          cp -r build/install/${{ steps.build_no.outputs.value }}/lib deploy-flat/
          cp Dockerfile deploy-flat/
          cp docker-compose.yml deploy-flat/
          echo "# dummy .dockerignore" > deploy-flat/.dockerignore
          cd deploy-flat
          tar czf ../deploy.tar.gz .

      - name: Upload deploy.tar.gz to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "~/release/${{ steps.build_no.outputs.value }}"

      - name: Extract and deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/release/${{ steps.build_no.outputs.value }}
            tar xzf deploy.tar.gz
            rm -f deploy.tar.gz
            docker build -t my-ktor-app:${{ steps.build_no.outputs.value }} .
            ln -sfn ~/release/${{ steps.build_no.outputs.value }} ~/release/head
#            docker stop my-ktor-app || true
#            docker rm my-ktor-app || true
#            docker run -d -p 8080:8080 --name my-ktor-app my-ktor-app:${{ steps.build_no.outputs.value }}
